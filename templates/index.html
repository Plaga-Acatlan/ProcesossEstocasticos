<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesos Markovianos de Decisión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<div class="container py-4">

    <!-- ==================== PASO 1: Configuración ==================== -->
    <section id="step-config" class="step-section card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Configuración Inicial</h4>
        </div>
        <div class="card-body">
            <form id="configForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="numDecisiones" class="form-label">Número de Decisiones (K): </label>
                        <input type="number" id="numDecisiones" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label for="numEstados" class="form-label">Número de Estados (N): </label>
                        <input type="number" id="numEstados" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label for="numPoliticas" class="form-label">Número de Políticas (P): </label>
                        <input type="number" id="numPoliticas" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label for="tipoOptimizacion" class="form-label">Tipo de Optimización: </label>
                        <select id="tipoOptimizacion" class="form-select" required>
                            <option value="" disabled selected>Seleccione…</option>
                            <option value="min">Minimizar</option>
                            <option value="max">Maximizar</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="submit" class="btn btn-success">Generar Matrices</button>
                </div>
            </form>
        </div>
    </section>

    <!-- ==================== PASO 2: Matrices de Transición ==================== -->
    <section id="step-transition" class="step-section card shadow-sm mt-4" style="display:none;">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Matrices de Transición <span id="transitionLabel"></span></h4>
        </div>
        <div class="card-body">
            <div id="transitionMatricesContainer"></div>
            <div class="mt-3 d-flex justify-content-between">
                <button id="btnBackToConfig" class="btn btn-outline-secondary">← Config</button>
                <span id="matrixCounter" class="align-self-center fw-bold"></span>
                <div>
                    <button id="btnPrevMatrix" class="btn btn-secondary me-2" disabled>← Anterior</button>
                    <button id="btnNextMatrix" class="btn btn-primary">Siguiente →</button>
                </div>
            </div>
            <div class="mt-3 text-end">
                <button id="btnFinishTransitions" class="btn btn-success d-none">Ir a Costos →</button>
            </div>
        </div>
    </section>

    <!-- ==================== PASO 3: Matriz de Costos ==================== -->
    <section id="step-costs" class="step-section card shadow-sm mt-4" style="display:none;">
        <div class="card-header bg-warning">
            <h4 class="mb-0">Matriz de Costos</h4>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table id="costTable" class="table table-bordered text-center align-middle"></table>
            </div>
            <div class="text-end mt-2">
                <button id="btnBackToTransitions" class="btn btn-outline-secondary">← Transiciones</button>
                <button id="btnGoPolicies" class="btn btn-success">Ir a Políticas →</button>
            </div>
        </div>
    </section>

    <!-- ==================== PASO 4: Políticas ==================== -->
    <section id="step-policies" class="step-section card shadow-sm mt-4" style="display:none;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Gestión de Políticas</h4>
        </div>
        <div class="card-body">
            <!-- Formulario para agregar política -->
            <div class="row g-2 align-items-end mb-3">
                <p class="text-muted">Cada política es un vector de <strong id="policySizeLabel">N</strong> enteros.</p>
                <div class="row g-2 align-items-end mb-3">
                    <div class="col">
                        <label class="form-label">Valores de la política</label>
                        <div id="policyInputRow" class="d-flex flex-wrap gap-2"></div>
                    </div>
                    <div class="col-auto">
                        <button id="btnAddPolicy" class="btn btn-primary" title="Agregar política">＋</button>
                    </div>
                </div>
            </div>

            <!-- Lista de políticas agregadas -->
            <div id="policiesList"></div>

            <div class="text-end mt-3">
                <button id="btnBackToCosts" class="btn btn-outline-secondary">← Costos</button>
                <button id="btnValidate" class="btn btn-danger btn-lg">Validar y Enviar</button>
            </div>
        </div>
    </section>

</div>

<!-- ==================== MODAL DE RESULTADO ==================== -->
<div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="resultModalTitle">Resultado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="resultModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/app.js"></script>
</body>
</html>
